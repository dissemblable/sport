services:
  postgres:
    image: postgres:17-alpine
    container_name: sport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: sport
    ports:
      # 5433 côté hôte pour ne pas entrer en conflit avec un Postgres local sur 5432
      - "5433:5432"
    volumes:
      - sport_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sport_pgdata:
