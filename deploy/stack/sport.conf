# Vhost du nginx du stack SSO, à copier vers /opt/stack/nginx/sites/sport.conf
# (modèle : sites/whoami.conf). Changer de sous-domaine = changer server_name.

server {
    listen 80;
    server_name sport.valldoy.com;

    include /etc/nginx/snippets/authelia-location.conf;

    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;

        set $upstream http://sport-web:80;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}
