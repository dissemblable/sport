# nginx du conteneur sport-web : sert l'interface et relaie /api vers sport-api.
#
# Il se trouve derrière le nginx du stack SSO, qui a déjà validé la session
# auprès d'Authelia et posé les en-têtes Remote-* (en écrasant toute valeur
# forgée par le client). Ils sont transmis tels quels à l'API, qui en déduit le
# compte connecté.

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Le nginx du stack journalise déjà chaque requête, avec le compte SSO.
    access_log off;

    # Résolution à chaque requête : nginx démarre même si l'API est arrêtée.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    location /api/ {
        set $api http://sport-api:3000;
        proxy_pass $api;

        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header Connection "";
    }

    # Fichiers nommés par leur empreinte par Vite : immuables.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    # Application monopage : les autres chemins sont rendus par React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
